[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hexif-pyutils"
version = "1.2.2"
description = "Super simple python utility library"
readme = "README.md"
requires-python = ">=3.9"

authors = [{name = "HeXif"}]

license = "MIT"

keywords = [
    "utilties",
    "utils",
    "python",
    "helpers"
]

dependencies = [
    "pyperclip>=1.8.2",
]

[project.urls]
Documentation = "https://hexif-pyutils.readthedocs.io/"
Homepage = "https://github.com/xHeXifx/hexif-pyutils"
Repository = "https://github.com/xHeXifx/hexif-pyutils"
Issues = "https://github.com/xHeXifx/hexif-pyutils/issues"

[project.optional-dependencies]
docs = [
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-gen-files",
    "mkdocs-literate-nav",
]

[tool.setuptools.packages.find]
include = ["utils*"]
